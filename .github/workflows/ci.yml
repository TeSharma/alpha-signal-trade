name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run tests
        run: |
          if [ -d tests ]; then pytest; else echo "No tests found, skipping."; fi

      - name: Create GitHub Issue (Test)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Automated Test Issue" \
            --body "This issue was created by a GitHub Action to verify token functionality."

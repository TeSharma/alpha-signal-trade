name: CI

on:
  push:
    branches:
      - "**"  # Runs on all branches
  pull_request:
    branches:
      - main
  workflow_dispatch:  # Allow manual trigger from Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.MY_PERSONAL_ACCESS_TOKEN }}  # Use your secret

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run tests
        run: |
          if [ -d tests ]; then pytest; else echo "No tests found, skipping."; fi

      - name: Create GitHub Issue (Test)
        env:
          GITHUB_TOKEN: ${{ secrets.MY_PERSONAL_ACCESS_TOKEN }}
        run: |
          gh issue create --title "Automated Test Issue" --body "This issue was created by a GitHub Action to verify token functionality."
